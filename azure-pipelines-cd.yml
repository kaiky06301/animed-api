# =========================================
# CD - Animed API (Sprint 4)
# Dispara sozinho quando o CI termina e publica um artefato novo:
# baixa o JAR e faz o deploy no Azure Web App (Java 17, Linux).
# Credenciais do banco vêm do grupo de variáveis "animed-secrets" (secret).
# =========================================
trigger: none
pr: none

resources:
  pipelines:
    - pipeline: ci
      source: 'animed-ci'
      trigger:
        branches:
          include:
            - master

# Agente self-hosted (pool Default): a org nova ainda não tem agente hospedado liberado.
pool:
  name: Default

variables:
  - group: animed-secrets
  - name: azureSubscription
    value: 'azure-lucas'
  - name: webAppName
    value: 'animed-api-559523'

stages:
  - stage: Deploy
    displayName: 'Deploy no Azure Web App'
    jobs:
      - deployment: WebApp
        displayName: 'Publicar animed-api.jar'
        environment: 'producao'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: ci
                  artifact: 'animed-api'
                  displayName: 'Baixar artefato do CI'

                - task: AzureWebApp@1
                  displayName: 'Deploy do JAR'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    appType: 'webAppLinux'
                    appName: '$(webAppName)'
                    package: '$(Pipeline.Workspace)/ci/animed-api/animed-api.jar'
                    runtimeStack: 'JAVA|17-java17'
                    appSettings: >-
                      -SPRING_PROFILES_ACTIVE oracle
                      -SPRING_DATASOURCE_URL "$(DB_URL)"
                      -SPRING_DATASOURCE_USERNAME "$(DB_USER)"
                      -SPRING_DATASOURCE_PASSWORD "$(DB_PASSWORD)"
                      -ANIMED_JWT_SECRET "$(JWT_SECRET)"

                # O plano gratuito demora para subir o Java na primeira chamada;
                # espera até 5 minutos pelo /actuator/health responder 200.
                - powershell: |
                    $url = "https://$(webAppName).azurewebsites.net/actuator/health"
                    for ($i = 1; $i -le 30; $i++) {
                      try {
                        $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 20 $url
                        Write-Host "Tentativa ${i}: HTTP $($r.StatusCode)"
                        if ($r.StatusCode -eq 200) { Write-Host $r.Content; exit 0 }
                      } catch { Write-Host "Tentativa ${i}: $($_.Exception.Message)" }
                      Start-Sleep -Seconds 10
                    }
                    Write-Host "API não respondeu 200 em 5 minutos"; exit 1
                  displayName: 'Conferir saúde da API'
