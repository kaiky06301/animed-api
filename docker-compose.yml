# =====================================================
# Animed — Compose local (app + Oracle, ambos container)
# Na nuvem o mesmo desenho sobe no ACI (ver scripts/).
# Credenciais vêm do arquivo .env (não versionado).
# =====================================================

services:
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: animed-oracle
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      ORACLE_DATABASE: ${ORACLE_DATABASE:-CLYVOVET}
      APP_USER: ${APP_USER:-clyvo}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 12
    networks:
      - animed-network

  animed-api:
    build: .
    image: animed-api:1.0
    container_name: animed-api
    depends_on:
      oracle-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: oracle
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@//oracle-db:1521/CLYVOVET
      SPRING_DATASOURCE_USERNAME: ${APP_USER:-clyvo}
      SPRING_DATASOURCE_PASSWORD: ${APP_USER_PASSWORD}
      ORACLE_SCHEMA: ${ORACLE_SCHEMA:-CLYVO}
      ANIMED_JWT_SECRET: ${ANIMED_JWT_SECRET}
    ports:
      - "8080:8080"
    networks:
      - animed-network

volumes:
  oracle-data:
    name: animed-oracle-data

networks:
  animed-network:
    driver: bridge
