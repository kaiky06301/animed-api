<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${perfil == 'DOUTOR' ? 'Cadastrar veterinário · Animed' : 'Cadastrar tutor · Animed'}">
        Cadastrar · Animed
    </title>
    <link rel="stylesheet" th:href="@{/css/animed.css}">
</head>
<body>

<header class="barra">
    <span class="marca">Animed</span>
    <nav>
        <a th:href="@{/painel/veterinario}">Agenda</a>
        <a th:href="@{/painel/veterinario/pacientes}">Pacientes</a>
        <a th:href="@{/painel/veterinario/cadastrar}" class="ativo">Cadastrar</a>
    </nav>
    <div class="usuario">
        <span th:text="${nome}">Veterinário</span>
        <form th:action="@{/logout}" method="post" style="margin:0">
            <button type="submit" class="botao contorno">Sair</button>
        </form>
    </div>
</header>

<main class="conteudo" style="max-width: 620px">
    <p class="subtitulo">Área do veterinário</p>
    <h1 th:text="${perfil == 'DOUTOR' ? 'Cadastrar veterinário' : 'Cadastrar tutor'}">
        Cadastrar
    </h1>

    <p style="color: var(--texto-secundario); font-size: 14px; margin-top: 4px"
       th:text="${perfil == 'DOUTOR'
                 ? 'A nova conta terá acesso aos atos clínicos: registrar vacina, prescrever e concluir atendimento.'
                 : 'O tutor recebe acesso ao aplicativo para acompanhar os próprios pets.'}">
    </p>

    <div class="aviso erro" th:if="${erro}" th:text="${erro}" style="margin-top: 16px"></div>

    <!-- Alternar entre os dois cadastros sem sair da página -->
    <div style="display: flex; gap: 8px; margin: 20px 0">
        <a th:href="@{/painel/veterinario/cadastrar(perfil='TUTOR')}"
           class="botao"
           th:classappend="${perfil != 'DOUTOR' ? '' : 'contorno'}">Tutor</a>
        <a th:href="@{/painel/veterinario/cadastrar(perfil='DOUTOR')}"
           class="botao"
           th:classappend="${perfil == 'DOUTOR' ? '' : 'contorno'}">Veterinário</a>
    </div>

    <div class="cartao">
        <form method="post" th:action="@{/painel/veterinario/cadastrar}">
            <input type="hidden" name="perfil" th:value="${perfil}">

            <div class="campo">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" required maxlength="120"
                       th:placeholder="${perfil == 'DOUTOR' ? 'Dra. Helena Prado' : 'Marina Oliveira'}">
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required maxlength="150"
                       placeholder="pessoa@email.com">
            </div>

            <div class="campo">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" required maxlength="14"
                       placeholder="000.000.000-00">
            </div>

            <div class="campo">
                <label for="telefone">Telefone</label>
                <input type="text" id="telefone" name="telefone" maxlength="20"
                       placeholder="(11) 90000-0000">
            </div>

            <div class="campo">
                <label for="senha">Senha de acesso</label>
                <input type="password" id="senha" name="senha" required minlength="6"
                       placeholder="Ao menos 6 caracteres">
            </div>

            <button type="submit" class="botao" style="width: 100%"
                    th:text="${perfil == 'DOUTOR' ? 'Cadastrar veterinário' : 'Cadastrar tutor'}">
                Cadastrar
            </button>
        </form>
    </div>

    <p style="font-size: 12px; color: var(--texto-suave); margin-top: 14px"
       th:if="${perfil == 'DOUTOR'}">
        Conta de veterinário só pode ser criada por quem já é veterinário — a regra
        vale também para quem chamar a API diretamente.
    </p>
</main>

</body>
</html>
