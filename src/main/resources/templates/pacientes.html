<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pacientes · Animed</title>
    <link rel="stylesheet" th:href="@{/css/animed.css}">
</head>
<body>

<header class="barra">
    <span class="marca">Animed</span>
    <nav>
        <a th:href="@{/painel/veterinario}">Agenda</a>
        <a th:href="@{/painel/veterinario/pacientes}" class="ativo">Pacientes</a>
        <a th:href="@{/painel/veterinario/cadastrar}">Cadastrar</a>
    </nav>
    <div class="usuario">
        <span th:text="${nome}">Veterinário</span>
        <form th:action="@{/logout}" method="post" style="margin:0">
            <button type="submit" class="botao contorno">Sair</button>
        </form>
    </div>
</header>

<main class="conteudo">
    <p class="subtitulo">Área do veterinário</p>
    <h1>Pacientes</h1>
    <p style="color: var(--texto-secundario); font-size: 14px; margin-top: 4px">
        <span th:text="${#lists.size(pets)}">0</span> na clínica
    </p>

    <div class="aviso ok" th:if="${sucesso}" th:text="${sucesso}" style="margin-top: 16px"></div>
    <div class="aviso erro" th:if="${erro}" th:text="${erro}" style="margin-top: 16px"></div>

    <form method="get" th:action="@{/painel/veterinario/pacientes}"
          style="display: flex; gap: 8px; margin: 20px 0">
        <input type="text" name="busca" th:value="${busca}"
               placeholder="Buscar por pet ou tutor"
               style="flex: 1; padding: 12px 14px; border-radius: 10px;
                      border: 1px solid var(--borda); background: var(--superficie);
                      color: var(--texto); font-size: 14px">
        <button type="submit" class="botao">Buscar</button>
    </form>

    <div class="vazio" th:if="${#lists.isEmpty(pets)}">
        Nenhum paciente encontrado.
    </div>

    <div class="cartao" th:each="pet : ${pets}"
         style="border-left: 3px solid var(--primaria)">
        <div style="font-size: 16px; font-weight: 700" th:text="${pet.nome()}">Nome</div>

        <div style="font-size: 12px; color: var(--texto-secundario); margin-top: 2px">
            <span th:text="${pet.especie()}">ESPECIE</span>
            <span th:if="${pet.raca()}" th:text="' · ' + ${pet.raca()}"></span>
            <span th:if="${pet.idadeAnos()}" th:text="' · ' + ${pet.idadeAnos()} + ' anos'"></span>
        </div>

        <div style="font-size: 12px; color: var(--texto-suave); margin-top: 4px"
             th:text="'Tutor: ' + ${pet.nomeTutor()}">Tutor</div>
    </div>
</main>

</body>
</html>
