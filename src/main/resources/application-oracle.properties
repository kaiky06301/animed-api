# =========================================
# Oracle (local, FIAP ou container na nuvem)
# Credenciais NUNCA ficam versionadas — vêm de variável de ambiente.
# =========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.default_schema=${ORACLE_SCHEMA:${SPRING_DATASOURCE_USERNAME}}
