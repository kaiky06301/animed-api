# =========================================
# Animed API - Configurações
# =========================================
spring.application.name=animed-api
server.port=8080

# Perfil ativo: oracle (nuvem/ACI) ou h2 (só teste local — H2 não é entrega)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:oracle}

# =========================================
# JPA / Hibernate
# =========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =========================================
# Flyway (Migrations)
# =========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# =========================================
# Cache
# =========================================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterAccess=10m

# =========================================
# Swagger / OpenAPI
# =========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# =========================================
# Actuator (health do container / Azure)
# =========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# =========================================
# Logging
# =========================================
logging.level.br.com.fiap.clyvovet=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO

# =========================================
# Segurança / JWT
# =========================================
# Segredo em Base64 usado para assinar os tokens.
# Em produção deve vir de variável de ambiente, nunca versionado.
animed.jwt.secret=${ANIMED_JWT_SECRET:bXVkZS1lc3RlLXNlZ3JlZG8tZW0tcHJvZHVjYW8tYW5pbWVkLWFwaS0yMDI2LWNoYWxsZW5nZQ==}
# Validade do token: 24 horas
animed.jwt.validade-ms=86400000

# Cria as contas de demonstração na inicialização (apagar em produção)
animed.seed-usuarios=true
